<svg viewBox="0 0 780 560" width="780" height="560" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.18"/>
    </pattern>
    <radialGradient id="crt" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0f0f0f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <clipPath id="type1">
      <rect x="88" y="90" height="22" width="0">
        <animate attributeName="width" from="0" to="100" dur="0.8s" begin="5.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="160" y="112" height="22" width="0">
        <animate attributeName="width" from="0" to="80" dur="0.7s" begin="6.7s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ══════ MONITOR CRT ══════ -->
  <rect x="0" y="0" width="780" height="560" rx="22" fill="#c9bfa8"/>
  <rect x="3" y="3" width="774" height="554" rx="20" fill="none" stroke="#a99e85" stroke-width="2"/>
  <rect x="26" y="22" width="728" height="474" rx="10" fill="#1a1a1a"/>
  <rect x="32" y="28" width="716" height="462" rx="8" fill="url(#crt)"/>

  <!-- bezel: marca + LED -->
  <text x="390" y="533" text-anchor="middle" font-size="14" fill="#8a7f66" font-weight="bold" letter-spacing="4">EVERTRON 486-DX</text>
  <text x="668" y="533" font-size="10" fill="#8a7f66">POWER</text>
  <circle cx="720" cy="529" r="5" fill="#28c840">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.1s" fill="freeze"/>
  </circle>
  <text x="60" y="533" font-size="10" fill="#8a7f66">TURBO ■</text>

  <!-- ══════ CENA 1 · BIOS POST (0s → 4.3s) ══════ -->
  <g opacity="0" transform="translate(20,0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.25s" begin="4.3s" fill="freeze"/>
    <text x="50" y="66" font-size="13" fill="#c0c0c0">Award Modular BIOS v4.51PG, An Energy Star Ally</text>
    <text x="50" y="88" font-size="13" fill="#808080">Copyright (C) 1984-97, Award Software, Inc.</text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.9s" fill="freeze"/>
      <text x="50" y="126" font-size="13" fill="#c0c0c0">PENTIUM-S CPU at 166 MHz</text>
    </g>

    <!-- contagem de memória -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.2s" fill="freeze"/>
      <text x="50" y="148" font-size="13" fill="#c0c0c0">Memory Test :</text>
    </g>
    <text x="165" y="148" font-size="13" fill="#c0c0c0" opacity="0">8192 KB
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.2s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="1.45s" fill="freeze"/>
    </text>
    <text x="165" y="148" font-size="13" fill="#c0c0c0" opacity="0">16384 KB
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.45s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="1.7s" fill="freeze"/>
    </text>
    <text x="165" y="148" font-size="13" fill="#c0c0c0" opacity="0">32768 KB
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.7s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="1.95s" fill="freeze"/>
    </text>
    <text x="165" y="148" font-size="13" fill="#c0c0c0" opacity="0">49152 KB
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.95s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="2.2s" fill="freeze"/>
    </text>
    <text x="165" y="148" font-size="13" fill="#c0c0c0" opacity="0">65536 KB OK
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.2s" fill="freeze"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.5s" fill="freeze"/>
      <text x="50" y="186" font-size="13" fill="#c0c0c0">Detecting IDE Primary Master ... QUANTUM FIREBALL 1.2GB</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.75s" fill="freeze"/>
      <text x="50" y="208" font-size="13" fill="#c0c0c0">Detecting IDE Primary Slave  ... CD-ROM 24X</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="3.0s" fill="freeze"/>
      <text x="50" y="230" font-size="13" fill="#c0c0c0">Keyboard ......... OK</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="3.2s" fill="freeze"/>
      <text x="50" y="252" font-size="13" fill="#c0c0c0">Mouse ............ OK</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="3.6s" fill="freeze"/>
      <text x="50" y="292" font-size="13" fill="#c0c0c0">Booting from drive C: ...</text>
    </g>
  </g>

  <!-- ══════ CENA 2 · MS-DOS (4.6s → 7.8s) ══════ -->
  <g opacity="0" transform="translate(20,0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.6s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.25s" begin="7.8s" fill="freeze"/>
    <text x="50" y="66" font-size="13" fill="#c0c0c0">Starting MS-DOS...</text>

    <!-- C:\> cd portfolio -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="5.2s" fill="freeze"/>
      <text x="50" y="106" font-size="13" fill="#c0c0c0">C:\&gt;</text>
    </g>
    <g clip-path="url(#type1)">
      <text x="90" y="106" font-size="13" fill="#ffffff">cd portfolio</text>
    </g>

    <!-- C:\PORTFOLIO> start.exe -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="6.5s" fill="freeze"/>
      <text x="50" y="128" font-size="13" fill="#c0c0c0">C:\PORTFOLIO&gt;</text>
    </g>
    <g clip-path="url(#type2)">
      <text x="162" y="128" font-size="13" fill="#ffffff">start.exe</text>
    </g>

    <!-- cursor da cena 2 -->
    <rect x="90" y="94" width="8" height="15" fill="#c0c0c0" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="5.2s" repeatCount="2"/>
    </rect>
    <rect x="240" y="116" width="8" height="15" fill="#c0c0c0" opacity="0">
      <animate attributeName="opacity" values="0;1;0;1;0" dur="1.4s" begin="7.3s" fill="freeze"/>
    </rect>
  </g>

  <!-- ══════ CENA 3 · LOADING (8.0s → 11.2s) ══════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="8.0s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.25s" begin="11.2s" fill="freeze"/>

    <text x="390" y="96" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold" letter-spacing="3">PORTFOLIO.EXE v1.0</text>
    <text x="390" y="122" text-anchor="middle" font-size="12" fill="#808080">(C) 1997 S8 SOFTWARE CORP.</text>

    <!-- moldura da barra -->
    <rect x="150" y="168" width="480" height="30" fill="none" stroke="#c0c0c0" stroke-width="2"/>
    <!-- blocos -->
    <rect x="156" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="8.4s" fill="freeze"/></rect>
    <rect x="180" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="8.53s" fill="freeze"/></rect>
    <rect x="204" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="8.66s" fill="freeze"/></rect>
    <rect x="228" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="8.79s" fill="freeze"/></rect>
    <rect x="252" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="8.92s" fill="freeze"/></rect>
    <rect x="276" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.05s" fill="freeze"/></rect>
    <rect x="300" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.18s" fill="freeze"/></rect>
    <rect x="324" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.31s" fill="freeze"/></rect>
    <rect x="348" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.44s" fill="freeze"/></rect>
    <rect x="372" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.57s" fill="freeze"/></rect>
    <rect x="396" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.70s" fill="freeze"/></rect>
    <rect x="420" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.83s" fill="freeze"/></rect>
    <rect x="444" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.96s" fill="freeze"/></rect>
    <rect x="468" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.09s" fill="freeze"/></rect>
    <rect x="492" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.22s" fill="freeze"/></rect>
    <rect x="516" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.35s" fill="freeze"/></rect>
    <rect x="540" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.48s" fill="freeze"/></rect>
    <rect x="564" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.61s" fill="freeze"/></rect>
    <rect x="588" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.74s" fill="freeze"/></rect>
    <rect x="604" y="174" width="20" height="18" fill="#c0c0c0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.85s" fill="freeze"/></rect>

    <!-- porcentagem -->
    <text x="390" y="228" text-anchor="middle" font-size="13" fill="#c0c0c0" opacity="0">24%
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="8.6s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="9.3s" fill="freeze"/>
    </text>
    <text x="390" y="228" text-anchor="middle" font-size="13" fill="#c0c0c0" opacity="0">57%
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="9.3s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="10.0s" fill="freeze"/>
    </text>
    <text x="390" y="228" text-anchor="middle" font-size="13" fill="#c0c0c0" opacity="0">86%
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.0s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="10.6s" fill="freeze"/>
    </text>
    <text x="390" y="228" text-anchor="middle" font-size="13" fill="#7ee787" opacity="0">100%
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="10.6s" fill="freeze"/>
    </text>

    <!-- logs de carregamento -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="8.8s" fill="freeze"/>
      <text x="150" y="278" font-size="12" fill="#808080">loading assets ............... ok</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="9.5s" fill="freeze"/>
      <text x="150" y="300" font-size="12" fill="#808080">linking modules .............. ok</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="10.2s" fill="freeze"/>
      <text x="150" y="322" font-size="12" fill="#808080">mounting interface ........... ok</text>
    </g>
  </g>

  <!-- ══════ CENA 4 · READY (11.5s → ∞) ══════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="11.5s" fill="freeze"/>

    <rect x="190" y="150" width="400" height="190" fill="none" stroke="#7ee787" stroke-width="2.5"/>
    <rect x="198" y="158" width="384" height="174" fill="none" stroke="#7ee787" stroke-width="1" opacity="0.45"/>

    <text x="390" y="216" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="bold" letter-spacing="4">PORTFOLIO.EXE</text>
    <text x="390" y="246" text-anchor="middle" font-size="12" fill="#808080" letter-spacing="2">CARREGADO COM SUCESSO</text>

    <text x="390" y="300" text-anchor="middle" font-size="16" fill="#7ee787" font-weight="bold" letter-spacing="2">► CLIQUE PARA INICIAR ◄
      <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.3s" begin="11.8s" repeatCount="indefinite"/>
    </text>

    <text x="50" y="466" font-size="13" fill="#c0c0c0">C:\PORTFOLIO&gt;</text>
    <rect x="162" y="454" width="8" height="15" fill="#c0c0c0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="11.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════ EFEITOS CRT (sempre visíveis) ══════ -->
  <rect x="32" y="28" width="716" height="462" rx="8" fill="url(#scan)"/>
  <rect x="32" y="28" width="716" height="462" rx="8" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.02;0;0.015;0;0.03;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
